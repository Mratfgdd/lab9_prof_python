[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "bank-perf"
version = "0.9.0"
description = "Laboratory work 9 (Professional Python): profiling and optimization of the bank ledger"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Nazar Levandivskyi" }]
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
bank-perf = "bank_perf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
filterwarnings = ["error"]

[tool.mypy]
strict = true
files = ["src", "tests", "benchmarks"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "PT"]
