[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "student-manager"
version = "0.9.0"
description = "Laboratory work 9 (Professional Python): profiling and optimization of the student records system"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Nazar Levandivskyi" }]
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=5"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "mypy>=1.10",
    "ruff>=0.5",
]

[project.scripts]
student-manager = "student_manager.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-ra", "--strict-markers"]
filterwarnings = [
    "error",
    "ignore:This process .* is multi-threaded:DeprecationWarning",
]

[tool.coverage.run]
branch = true
source = ["student_manager"]

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_also = ['if __name__ == "__main__":']

[tool.mypy]
strict = true
mypy_path = ["src", "tests", "benchmarks", "report"]
files = ["src", "tests", "benchmarks", "report"]

[[tool.mypy.overrides]]
module = "build_report"
disallow_untyped_calls = false

[tool.ruff]
line-length = 79
target-version = "py311"
src = ["src", "tests", "benchmarks", "report"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "PT", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.bandit]
skips = ["B311"]

[tool.pylint.main]
source-roots = ["src", "tests", "benchmarks", "report"]

[tool.pylint.basic]
no-docstring-rgx = "^(_|test_)"

[tool.pylint.messages_control]
disable = ["redefined-outer-name"]

[tool.pylint.design]
min-public-methods = 1
max-attributes = 10
